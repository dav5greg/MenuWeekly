name: Fix weekend start

on:
  push:
    paths:
      - '.github/workflows/menuweekly-fix-weekend-start.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update initial week logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "async function load(){try{const r=await fetch(API_URL,{cache:'no-store'});if(!r.ok)throw new Error();const j=await r.json();db=j.data;version=j.version;renderAll()}catch(e){showStatus('Impossibile caricare i dati');renderAll()}}"
          new = "async function load(){try{const r=await fetch(API_URL,{cache:'no-store'});if(!r.ok)throw new Error();const j=await r.json();db=j.data;version=j.version;const today=new Date();if(!db.settings.showWeekend&&(today.getDay()===0||today.getDay()===6)){const next=new Date(today);next.setDate(next.getDate()+7);currentWeek=getMonday(next)}else{currentWeek=getMonday(today)}renderAll()}catch(e){showStatus('Impossibile caricare i dati');renderAll()}}"
          if old not in s:
              raise SystemExit('Target load() non trovato: nessuna modifica eseguita')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/menuweekly-fix-weekend-start.yml
          git add index.html .github/workflows/menuweekly-fix-weekend-start.yml
          git commit -m 'Posiziona la settimana successiva nel weekend'
          git push
