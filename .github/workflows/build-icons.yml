name: Build app icons

on:
  push:
    paths:
      - 'icon-design.svg'
      - '.github/workflows/build-icons.yml'

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG icons
        run: |
          npm install --no-save sharp
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const input = fs.readFileSync('icon-design.svg');
          (async () => {
            for (const size of [180, 192, 512]) {
              await sharp(input).resize(size, size, { fit: 'fill' }).png().toFile(`icon-${size}.png`);
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-180.png icon-192.png icon-512.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Pubblica nuova icona MenuWeekly'
          git push
