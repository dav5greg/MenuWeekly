name: Build app icons

on:
  push:
    paths:
      - 'icon-source.svg'
      - '.github/workflows/build-icons.yml'

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG icons
        run: |
          python3 -m pip install --user pillow
          python3 - <<'PY'
          import re, base64
          from pathlib import Path
          from PIL import Image
          s = Path('icon-source.svg').read_text()
          m = re.search(r'data:image/(?:png|jpeg);base64,([^"\']+)', s)
          if not m:
              raise SystemExit('Icon source image not found')
          payload = m.group(1)
          payload += '=' * (-len(payload) % 4)
          source = Path('/tmp/source.bin')
          source.write_bytes(base64.b64decode(payload))
          img = Image.open(source).convert('RGBA')
          for size in (180, 192, 512):
              img.resize((size, size), Image.Resampling.LANCZOS).save(f'icon-{size}.png', format='PNG', optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-180.png icon-192.png icon-512.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Pubblica la stessa icona su iPhone e Android'
          git push