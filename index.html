<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f2">
<title>MenuWeekly 🍴</title>
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#243128;--muted:#758079;--line:#dfe6df;--green:#47745a;--green-soft:#e6f0e8;--blue:#e9f1f7;--blue-ink:#52718a;--danger:#b85b5b;--shadow:0 8px 24px rgba(39,55,44,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}body{padding-bottom:82px}.app{width:min(720px,100%);margin:auto;min-height:100vh}header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:64px;background:rgba(243,246,242,.97);z-index:20;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}.brand{font-weight:850;font-size:24px;letter-spacing:-.04em}.brand span{margin-right:7px}main{padding:78px 14px 18px}.page{display:none}.page.active{display:block}.weekbar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}.week-title{font-weight:800;font-size:18px}.week-sub{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}.navbtn{width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:22px}.menu-card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.menu-head,.day-row{display:grid;grid-template-columns:62px 1fr 1fr}.menu-head{background:#f7f9f6;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;color:var(--muted)}.menu-head div{padding:12px 8px;text-align:center}.menu-head div+div{border-left:1px solid var(--line)}.day-row{min-height:82px;border-bottom:1px solid var(--line)}.day-row:last-child{border-bottom:0}.day-name{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:850;color:#66726a}.meal{padding:7px;border-left:1px solid var(--line);display:flex;align-items:stretch}.meal-btn{width:100%;min-height:66px;border-radius:14px;border:1px dashed #ccd6ce;background:#fafcf9;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:12px;font-weight:700;color:#78837b}.meal-btn.dish{background:var(--green-soft);border:1px solid #cfe0d3;color:#355b43}.meal-btn.free{background:var(--blue);border:1px solid #d5e3ec;color:var(--blue-ink)}.meal-btn .notebook{font-size:16px;margin-right:6px}.meal-btn .plus{font-size:23px;font-weight:400;color:#9aa49d}.section-title{font-size:22px;font-weight:850;letter-spacing:-.03em;margin:4px 2px 14px}.dishes-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}.dishes-head .section-title{margin:0}.add-dish{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:400;line-height:1;box-shadow:0 6px 14px rgba(71,116,90,.18)}.search{position:relative;margin-bottom:12px}.search input{width:100%;height:46px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 42px;color:var(--ink);outline:none}.search .lens{position:absolute;left:14px;top:10px;color:#88928b;font-size:23px;font-weight:500;line-height:26px;pointer-events:none}.search .clear{position:absolute;right:8px;top:6px;width:34px;height:34px;border-radius:10px;color:#8a958d;font-size:18px}.dish-list{display:flex;flex-direction:column;gap:6px}.dish-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 12px;min-height:44px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}.dish-name{font-size:14px;font-weight:750}.dish-actions{display:flex;align-items:center;gap:6px;margin-left:10px}.dish-action{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}.dish-action.edit{background:#edf5ee;color:#47745a}.dish-action.delete{background:#fbefef;color:#b85b5b}.dish-action svg{width:23px;height:23px;display:block}.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px;background:#fff;border:1px dashed var(--line);border-radius:16px}.settings-list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.setting{padding:17px 16px;display:flex;align-items:center;justify-content:space-between}.setting+.setting{border-top:1px solid var(--line)}.setting-title{font-size:14px;font-weight:750}.setting-desc{font-size:11px;color:var(--muted);margin-top:3px}.switch{width:46px;height:27px;border-radius:20px;background:#cfd7d1;padding:3px;transition:.2s}.switch i{display:block;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0002;transition:.2s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(19px)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:72px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:20;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}.tab{border-radius:13px;color:#89938c;font-size:10px;font-weight:800}.tab.active{background:#eef4ee;color:var(--green)}.tab .ico{font-size:19px;display:block;line-height:20px;margin-bottom:2px}.overlay{position:fixed;inset:0;background:rgba(28,38,31,.35);backdrop-filter:blur(3px);z-index:40;display:none}.overlay.show{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;margin:auto;width:min(720px,100%);max-height:78vh;background:#fff;border-radius:24px 24px 0 0;padding:9px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #1f302420;overflow:auto}.handle{width:42px;height:4px;border-radius:10px;background:#d6ddd7;margin:3px auto 15px}.sheet-title{font-size:18px;font-weight:850;margin-bottom:12px}.selector-top-actions{margin-bottom:12px}.sheet-search{position:relative;margin-bottom:10px}.sheet-search input{width:100%;height:44px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:0 40px;color:var(--ink);outline:none}.sheet-search .lens{position:absolute;left:13px;top:9px;color:#88928b;font-size:22px;line-height:25px;pointer-events:none}.sheet-search .clear{position:absolute;right:7px;top:5px;width:34px;height:34px;border-radius:10px;color:#8a958d;font-size:18px}.sheet-list{display:flex;flex-direction:column;gap:7px}.sheet-row{padding:14px;border:1px solid #cfe0d3;border-radius:13px;text-align:left;background:#edf6ef;color:#355b43;font-size:13px;font-weight:750}.sheet-actions{display:flex;flex-direction:column;gap:8px}.action{padding:14px;border-radius:13px;text-align:left;font-size:13px;font-weight:750}.action.free-action{background:#e8f1f8;border:1px solid #cbdde9;color:#466c86}.action.cancel{background:#f3f4f3;border:1px solid #e0e3e0;color:#68726c;text-align:center}.action.danger{color:var(--danger);background:#fbf0f0}.selector-bottom-actions{margin-top:8px}.modal{position:fixed;inset:0;background:rgba(28,38,31,.45);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(390px,100%);background:#fff;border-radius:22px;padding:20px;box-shadow:0 20px 60px #20302530}.dialog h3{margin:0;font-size:18px}.dialog p{font-size:12px;color:var(--muted);line-height:1.5}.dialog input{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;padding:0 13px;outline:none}.dialog-actions{display:flex;gap:8px;margin-top:14px}.dialog-actions button{flex:1;padding:12px;border-radius:12px;font-size:12px;font-weight:800;background:#f1f4f1}.dialog-actions .primary{background:var(--green);color:#fff}.confirm-dialog{text-align:center}.confirm-icon{width:48px;height:48px;border-radius:14px;background:#fbefef;color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}.confirm-icon svg{width:25px;height:25px}.confirm-dialog h3{margin:0}.confirm-dialog p{margin:8px 0 0}.confirm-dialog .dialog-actions{margin-top:18px}.confirm-dialog .delete-confirm{background:var(--danger);color:#fff}.status{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:70;background:#243128;color:#fff;border-radius:20px;padding:8px 13px;font-size:11px;font-weight:750;opacity:0;pointer-events:none;transition:.2s}.status.show{opacity:1}.loading{padding:50px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="app"><header><div class="brand"><span>🍴</span>MenuWeekly</div></header><main>
<section id="page-menu" class="page active"><div class="weekbar"><button class="navbtn" onclick="changeWeek(-1)">‹</button><div style="text-align:center"><div id="week-title" class="week-title"></div><span id="week-sub" class="week-sub"></span></div><button class="navbtn" onclick="changeWeek(1)">›</button></div><div id="menu-grid" class="menu-card"><div class="loading">Caricamento…</div></div></section>
<section id="page-dishes" class="page"><div class="dishes-head"><div class="section-title">I miei piatti</div><button class="add-dish" aria-label="Aggiungi piatto" onclick="openDishModal()">+</button></div><div class="search"><span class="lens">⌕</span><input id="dish-search" oninput="renderDishes()" placeholder="Cerca un piatto…"><button class="clear" onclick="clearSearch()">×</button></div><div id="dish-list" class="dish-list"></div></section>
<section id="page-settings" class="page"><div class="section-title">Impostazioni</div><div class="settings-list"><div class="setting"><div><div class="setting-title">Mostra weekend</div><div class="setting-desc">Aggiunge sabato e domenica al menu settimanale.</div></div><button id="weekend-switch" class="switch" onclick="toggleWeekend()"><i></i></button></div></div></section>
</main><nav><button id="tab-menu" class="tab active" onclick="showPage('menu')"><span class="ico">☷</span>MENU</button><button id="tab-dishes" class="tab" onclick="showPage('dishes')"><span class="ico">🍽</span>I MIEI PIATTI</button><button id="tab-settings" class="tab" onclick="showPage('settings')"><span class="ico">⚙</span>IMPOSTAZIONI</button></nav></div>
<div id="sheet-overlay" class="overlay" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet"></div></div><div id="modal-overlay" class="modal"><div id="dialog" class="dialog"><h3 id="modal-title">Aggiungi piatto</h3><p id="modal-text"></p><input id="modal-input" maxlength="80" placeholder="Nome del piatto"><div class="dialog-actions"><button onclick="closeModal()">Annulla</button><button class="primary" onclick="saveModal()">Salva</button></div></div></div><div id="status" class="status"></div>
<script>
const API_URL='https://menu-weekly-gregdavide-4207.vercel.app/api/menu';const dayDefs=[['monday','LUN'],['tuesday','MAR'],['wednesday','MER'],['thursday','GIO'],['friday','VEN'],['saturday','SAB'],['sunday','DOM']];let db={dishes:[],weeks:{},settings:{showWeekend:false}},version=null,currentWeek=getMonday(new Date()),selectedCell=null,modalMode='dish',confirmDishId=null;
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}function pad(n){return String(n).padStart(2,'0')}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function getMonday(d){const x=new Date(d);x.setHours(12,0,0,0);const day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}function fmtWeek(d){const end=new Date(d);end.setDate(end.getDate()+4);const a=d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'});const b=end.toLocaleDateString('it-IT',{day:'2-digit',month:'short'});return a+' – '+b}function weekRecord(){const key=iso(currentWeek);if(!db.weeks[key]){db.weeks[key]={};dayDefs.forEach(([day])=>db.weeks[key][day]={lunch:null,dinner:null})}return db.weeks[key]}
async function load(){try{const r=await fetch(API_URL,{cache:'no-store'});if(!r.ok)throw new Error();const j=await r.json();db=j.data;version=j.version;renderAll()}catch(e){showStatus('Impossibile caricare i dati');renderAll()}}async function save(){try{const r=await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Expected-SHA':version},body:JSON.stringify(db)});if(r.status===409){const j=await r.json();db=j.data;version=j.version;renderAll();showStatus('Dati aggiornati da un altro dispositivo');return false}if(!r.ok)throw new Error();const j=await r.json();db=j.data;version=j.version;renderAll();return true}catch(e){showStatus('Salvataggio non riuscito');return false}}
function renderAll(){document.getElementById('week-title').textContent=fmtWeek(currentWeek);document.getElementById('week-sub').textContent=currentWeek.getFullYear();renderMenu();renderDishes();updateSwitch()}function renderMenu(){const rec=weekRecord();let html='<div class="menu-head"><div></div><div>☀️ Pranzo</div><div>🌙 Cena</div></div>';dayDefs.forEach(([key,label],i)=>{if(i>4&&!db.settings.showWeekend)return;html+=`<div class="day-row"><div class="day-name">${label}</div>${cellHtml(key,'lunch',rec[key]?.lunch)}${cellHtml(key,'dinner',rec[key]?.dinner)}</div>`});document.getElementById('menu-grid').innerHTML=html}function cellHtml(day,meal,value){if(!value)return `<div class="meal"><button class="meal-btn" onclick="openSelector('${day}','${meal}')"><span class="plus">＋</span></button></div>`;if(value.type==='free')return `<div class="meal"><button class="meal-btn free" onclick="openCellActions('${day}','${meal}')"><span class="notebook">▤</span>${esc(value.text)}</button></div>`;const d=db.dishes.find(x=>x.id===value.dishId);return `<div class="meal"><button class="meal-btn dish" onclick="openCellActions('${day}','${meal}')">${esc(d?.title||'Piatto')}</button></div>`}function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function changeWeek(delta){currentWeek.setDate(currentWeek.getDate()+delta*7);document.getElementById('week-title').textContent=fmtWeek(currentWeek);document.getElementById('week-sub').textContent=currentWeek.getFullYear();renderMenu()}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+p).classList.add('active');if(p==='dishes')renderDishes()}
function renderDishes(){const q=(document.getElementById('dish-search')?.value||'').trim().toLowerCase();const list=db.dishes.filter(d=>d.title.toLowerCase().includes(q)).sort((a,b)=>a.title.localeCompare(b.title,'it'));document.getElementById('dish-list').innerHTML=list.length?list.map(d=>`<div class="dish-item"><div class="dish-name">${esc(d.title)}</div><div class="dish-actions"><button class="dish-action edit" aria-label="Modifica" onclick="renameDish('${d.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l3.6-.8L19.2 7.6a2.1 2.1 0 0 0 0-3L18.4 3.8a2.1 2.1 0 0 0-3 0L3.8 15.4 3 21Z"/><path d="M13.8 5.4l4.8 4.8"/></svg></button><button class="dish-action delete" aria-label="Cancella" onclick="openDeleteDish('${d.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M7 7l1 13h10L17 7"/><path d="M10 11v5M14 11v5"/></svg></button></div></div>`).join(''):'<div class="empty">Nessun piatto trovato.</div>'}
function clearSearch(){const e=document.getElementById('dish-search');e.value='';renderDishes();e.focus()}
function openSelector(day,meal){selectedCell={day,meal};const sheet=document.getElementById('sheet');sheet.innerHTML=`<div class="handle"></div><div class="sheet-title">Scegli il piatto</div><div class="sheet-actions selector-top-actions"><button class="action free-action" onclick="openFreeText()">✎ Inserisci testo libero</button></div><div class="sheet-search"><span class="lens">⌕</span><input id="selector-search" oninput="renderSelectorList()" placeholder="Cerca un piatto…"><button class="clear" onclick="clearSelectorSearch()">×</button></div><div id="selector-list" class="sheet-list"></div><div class="sheet-actions selector-bottom-actions"><button class="action cancel" onclick="closeSheet()">Annulla</button></div>`;document.getElementById('sheet-overlay').classList.add('show');renderSelectorList();document.getElementById('selector-search').focus()}
function renderSelectorList(){const q=(document.getElementById('selector-search')?.value||'').trim().toLowerCase();const list=db.dishes.filter(d=>d.title.toLowerCase().includes(q)).sort((a,b)=>a.title.localeCompare(b.title,'it'));document.getElementById('selector-list').innerHTML=list.length?list.map(d=>`<button class="sheet-row" onclick="chooseDish('${d.id}')">${esc(d.title)}</button>`).join(''):'<div class="empty">Nessun piatto trovato.</div>'}function clearSelectorSearch(){const e=document.getElementById('selector-search');e.value='';renderSelectorList();e.focus()}
function openCellActions(day,meal){selectedCell={day,meal};const v=weekRecord()[day][meal];document.getElementById('sheet').innerHTML=`<div class="handle"></div><div class="sheet-title">Modifica pasto</div><div class="sheet-actions">${v?.type==='free'?'<button class="action free-action" onclick="openFreeTextEdit()">✎ Modifica testo</button>':''}<button class="action" onclick="openSelector(selectedCell.day,selectedCell.meal)">↔ Cambia piatto</button><button class="action danger" onclick="clearCell()">✕ Rimuovi</button><button class="action cancel" onclick="closeSheet()">Annulla</button></div>`;document.getElementById('sheet-overlay').classList.add('show')}function closeSheet(){document.getElementById('sheet-overlay').classList.remove('show');selectedCell=null}function chooseDish(dishId){if(!selectedCell)return;weekRecord()[selectedCell.day][selectedCell.meal]={type:'dish',dishId};closeSheet();renderMenu();save()}function openFreeText(){const cell=selectedCell;closeSheet();selectedCell=cell;modalMode='free';document.getElementById('modal-title').textContent='Testo libero';document.getElementById('modal-text').textContent='Inserisci un pasto senza aggiungerlo all’elenco dei piatti.';document.getElementById('modal-input').value='';document.getElementById('modal-overlay').classList.add('show');document.getElementById('modal-input').focus()}function openFreeTextEdit(){const cell=selectedCell;const v=weekRecord()[cell.day][cell.meal];closeSheet();selectedCell=cell;modalMode='free-edit';document.getElementById('modal-title').textContent='Modifica testo';document.getElementById('modal-text').textContent='Modifica il testo del pasto.';document.getElementById('modal-input').value=v?.text||'';document.getElementById('modal-overlay').classList.add('show');document.getElementById('modal-input').focus()}function openDishModal(){modalMode='dish';document.getElementById('modal-title').textContent='Aggiungi piatto';document.getElementById('modal-text').textContent='Aggiungi un piatto all’elenco disponibile nel menu.';document.getElementById('modal-input').value='';document.getElementById('modal-overlay').classList.add('show');document.getElementById('modal-input').focus()}function renameDish(dishId){modalMode='rename';document.getElementById('modal-title').textContent='Modifica piatto';document.getElementById('modal-text').textContent='Modifica il nome del piatto.';document.getElementById('modal-input').value=db.dishes.find(x=>x.id===dishId)?.title||'';document.getElementById('modal-input').dataset.dishId=dishId;document.getElementById('modal-overlay').classList.add('show');document.getElementById('modal-input').focus()}
function openDeleteDish(dishId){const d=db.dishes.find(x=>x.id===dishId);if(!d)return;const count=Object.values(db.weeks).reduce((n,w)=>n+Object.values(w).reduce((m,day)=>m+(day.lunch?.dishId===dishId?1:0)+(day.dinner?.dishId===dishId?1:0),0),0);confirmDishId=dishId;document.getElementById('dialog').className='dialog confirm-dialog';document.getElementById('dialog').innerHTML=`<div class="confirm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M7 7l1 13h10L17 7"/><path d="M10 11v5M14 11v5"/></svg></div><h3>Eliminare piatto?</h3><p>Vuoi eliminare <strong>"${esc(d.title)}"</strong>?${count?` È presente in ${count} pasti.`:''}</p><div class="dialog-actions"><button onclick="closeModal()">Annulla</button><button class="delete-confirm" onclick="confirmDeleteDish()">Elimina</button></div>`;document.getElementById('modal-overlay').classList.add('show')}
function confirmDeleteDish(){const dishId=confirmDishId;const d=db.dishes.find(x=>x.id===dishId);if(!d)return;db.dishes=db.dishes.filter(x=>x.id!==dishId);Object.values(db.weeks).forEach(w=>Object.values(w).forEach(day=>{if(day.lunch?.dishId===dishId)day.lunch=null;if(day.dinner?.dishId===dishId)day.dinner=null}));confirmDishId=null;closeModal();renderAll();save()}function closeModal(){document.getElementById('modal-overlay').classList.remove('show');document.getElementById('dialog').className='dialog';document.getElementById('dialog').innerHTML='<h3 id="modal-title">Aggiungi piatto</h3><p id="modal-text"></p><input id="modal-input" maxlength="80" placeholder="Nome del piatto"><div class="dialog-actions"><button onclick="closeModal()">Annulla</button><button class="primary" onclick="saveModal()">Salva</button></div>';document.getElementById('modal-input').dataset.dishId='';document.getElementById('modal-input').addEventListener('keydown',e=>{if(e.key==='Enter')saveModal();if(e.key==='Escape')closeModal()});selectedCell=null}
async function saveModal(){const input=document.getElementById('modal-input');const text=input.value.trim();if(!text)return;if(modalMode==='dish'){if(db.dishes.some(d=>d.title.trim().toLowerCase()===text.toLowerCase())){showStatus('Questo piatto esiste già');return}db.dishes.push({id:id(),title:text})}else if(modalMode==='rename'){const dish=db.dishes.find(d=>d.id===input.dataset.dishId);if(!dish)return;if(db.dishes.some(d=>d.id!==dish.id&&d.title.trim().toLowerCase()===text.toLowerCase())){showStatus('Questo piatto esiste già');return}dish.title=text}else if(modalMode==='free'||modalMode==='free-edit'){if(!selectedCell)return;weekRecord()[selectedCell.day][selectedCell.meal]={type:'free',text}}closeModal();renderAll();save()}function clearCell(){if(!selectedCell)return;weekRecord()[selectedCell.day][selectedCell.meal]=null;closeSheet();renderMenu();save()}function updateSwitch(){document.getElementById('weekend-switch')?.classList.toggle('on',!!db.settings.showWeekend)}async function toggleWeekend(){db.settings.showWeekend=!db.settings.showWeekend;updateSwitch();renderMenu();await save()}function showStatus(t){const e=document.getElementById('status');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}document.getElementById('modal-input').addEventListener('keydown',e=>{if(e.key==='Enter')saveModal();if(e.key==='Escape')closeModal()});load();
</script></body></html>
