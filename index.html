<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f2">
<title>MenuWeekly 🍴</title>
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#243128;--muted:#758079;--line:#dfe6df;--green:#47745a;--green-soft:#e6f0e8;--blue:#e9f1f7;--blue-ink:#52718a;--danger:#b85b5b;--shadow:0 8px 24px rgba(39,55,44,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}body{padding-bottom:82px}.app{width:min(720px,100%);margin:auto;min-height:100vh}
header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:64px;background:rgba(243,246,242,.97);z-index:20;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}.brand{font-weight:850;font-size:24px;letter-spacing:-.04em}.brand span{margin-right:7px}
main{padding:78px 14px 18px}.page{display:none}.page.active{display:block}.weekbar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}.week-title{font-weight:800;font-size:18px}.week-sub{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}.navbtn{width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:22px}.menu-card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.menu-head,.day-row{display:grid;grid-template-columns:62px 1fr 1fr}.menu-head{background:#f7f9f6;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;color:var(--muted)}.menu-head div{padding:12px 8px;text-align:center}.menu-head div+div{border-left:1px solid var(--line)}
.day-row{min-height:82px;border-bottom:1px solid var(--line)}.day-row:last-child{border-bottom:0}.day-name{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:850;color:#66726a}.meal{padding:7px;border-left:1px solid var(--line);display:flex;align-items:stretch}.meal-btn{width:100%;min-height:66px;border-radius:14px;border:1px dashed #ccd6ce;background:#fafcf9;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:12px;font-weight:700;color:#78837b}.meal-btn.dish{background:var(--green-soft);border:1px solid #cfe0d3;color:#355b43}.meal-btn.free{background:var(--blue);border:1px solid #d5e3ec;color:var(--blue-ink)}.meal-btn .notebook{font-size:16px;margin-right:6px}.meal-btn .plus{font-size:23px;font-weight:400;color:#9aa49d}.weekend-hidden{display:none}
.quick{margin-top:14px;width:100%;background:var(--green);color:#fff;border-radius:15px;padding:13px 15px;font-size:12px;font-weight:850;box-shadow:0 8px 18px rgba(71,116,90,.18)}
.section-title{font-size:22px;font-weight:850;letter-spacing:-.03em;margin:4px 2px 14px}.subtle{font-size:12px;color:var(--muted);margin:-8px 2px 16px}.search{position:relative;margin-bottom:12px}.search input{width:100%;height:46px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 42px;color:var(--ink);outline:none}.search input:focus{border-color:#a9bcae}.search .lens{position:absolute;left:14px;top:13px;color:#88928b;font-size:17px;pointer-events:none}.search .clear{position:absolute;right:8px;top:6px;width:34px;height:34px;border-radius:10px;color:#8a958d;font-size:18px}.dish-list{display:flex;flex-direction:column;gap:8px}.dish-item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}.dish-name{font-size:14px;font-weight:750}.dish-count{font-size:10px;color:var(--muted);margin-top:3px}.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px;background:#fff;border:1px dashed var(--line);border-radius:16px}
.settings-list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.setting{padding:17px 16px;display:flex;align-items:center;justify-content:space-between}.setting+.setting{border-top:1px solid var(--line)}.setting-title{font-size:14px;font-weight:750}.setting-desc{font-size:11px;color:var(--muted);margin-top:3px}.switch{width:46px;height:27px;border-radius:20px;background:#cfd7d1;padding:3px;transition:.2s}.switch i{display:block;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0002;transition:.2s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(19px)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:72px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:20;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}.tab{border-radius:13px;color:#89938c;font-size:10px;font-weight:800}.tab.active{background:#eef4ee;color:var(--green)}.tab .ico{font-size:19px;display:block;line-height:20px;margin-bottom:2px}
.overlay{position:fixed;inset:0;background:rgba(28,38,31,.35);backdrop-filter:blur(3px);z-index:40;display:none}.overlay.show{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;margin:auto;width:min(720px,100%);max-height:78vh;background:#fff;border-radius:24px 24px 0 0;padding:9px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #1f302420;overflow:auto}.handle{width:42px;height:4px;border-radius:10px;background:#d6ddd7;margin:3px auto 15px}.sheet-title{font-size:18px;font-weight:850;margin-bottom:12px}.sheet-list{display:flex;flex-direction:column;gap:7px}.sheet-row{padding:14px;border:1px solid var(--line);border-radius:13px;text-align:left;background:#fafcf9;font-size:13px;font-weight:700}.sheet-row:hover{background:#f1f6f1}.sheet-actions{display:flex;flex-direction:column;gap:8px}.action{padding:14px;border-radius:13px;background:#f5f7f5;text-align:left;font-size:13px;font-weight:750}.action.danger{color:var(--danger);background:#fbf0f0}.action.cancel{text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(28,38,31,.45);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(390px,100%);background:#fff;border-radius:22px;padding:20px;box-shadow:0 20px 60px #20302530}.dialog h3{margin:0;font-size:18px}.dialog p{font-size:12px;color:var(--muted);line-height:1.5}.dialog input{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;padding:0 13px;outline:none}.dialog-actions{display:flex;gap:8px;margin-top:14px}.dialog-actions button{flex:1;padding:12px;border-radius:12px;font-size:12px;font-weight:800;background:#f1f4f1}.dialog-actions .primary{background:var(--green);color:#fff}.status{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:70;background:#243128;color:#fff;border-radius:20px;padding:8px 13px;font-size:11px;font-weight:750;opacity:0;pointer-events:none;transition:.2s}.status.show{opacity:1}.loading{padding:50px;text-align:center;color:var(--muted);font-size:13px}
@media(min-width:650px){main{padding-left:18px;padding-right:18px}.day-row{min-height:88px}.meal-btn{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><span>🍴</span>MenuWeekly</div></header>
<main>
<section id="page-menu" class="page active"><div class="weekbar"><button class="navbtn" onclick="changeWeek(-1)">‹</button><div style="text-align:center"><div id="week-title" class="week-title"></div><span id="week-sub" class="week-sub"></span></div><button class="navbtn" onclick="changeWeek(1)">›</button></div><div id="menu-grid" class="menu-card"><div class="loading">Caricamento…</div></div><button class="quick" onclick="showPage('dishes')">I miei piatti</button></section>
<section id="page-dishes" class="page"><div class="section-title">I miei piatti</div><div class="subtle">Il tuo elenco di piatti disponibili nel menu.</div><div class="search"><span class="lens">⌕</span><input id="dish-search" oninput="renderDishes()" placeholder="Cerca un piatto…"><button class="clear" onclick="clearSearch()">×</button></div><button class="quick" style="margin:0 0 12px" onclick="openDishModal()">＋ Aggiungi piatto</button><div id="dish-list" class="dish-list"></div></section>
<section id="page-settings" class="page"><div class="section-title">Impostazioni</div><div class="subtle">Preferenze di visualizzazione dell'app.</div><div class="settings-list"><div class="setting"><div><div class="setting-title">Mostra weekend</div><div class="setting-desc">Aggiunge sabato e domenica al menu settimanale.</div></div><button id="weekend-switch" class="switch" onclick="toggleWeekend()"><i></i></button></div></div></section>
</main>
<nav><button id="tab-menu" class="tab active" onclick="showPage('menu')"><span class="ico">☷</span>MENU</button><button id="tab-dishes" class="tab" onclick="showPage('dishes')"><span class="ico">🍽</span>I MIEI PIATTI</button><button id="tab-settings" class="tab" onclick="showPage('settings')"><span class="ico">⚙</span>IMPOSTAZIONI</button></nav>
</div>
<div id="sheet-overlay" class="overlay" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet"></div></div>
<div id="modal-overlay" class="modal"><div class="dialog"><h3 id="modal-title">Aggiungi piatto</h3><p id="modal-text"></p><input id="modal-input" maxlength="80" placeholder="Nome del piatto"><div class="dialog-actions"><button onclick="closeModal()">Annulla</button><button class="primary" onclick="saveDish()">Salva</button></div></div></div>
<div id="status" class="status"></div>
<script>
const API_URL='https://menu-weekly-gregdavide-4207.vercel.app/api/menu';
const dayDefs=[['monday','LUN'],['tuesday','MAR'],['wednesday','MER'],['thursday','GIO'],['friday','VEN'],['saturday','SAB'],['sunday','DOM']];
let db={dishes:[],weeks:{},settings:{showWeekend:false}},version=null,currentWeek=getMonday(new Date()),selectedCell=null,modalMode='dish';
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function getMonday(d){const x=new Date(d);x.setHours(12,0,0,0);const day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
function fmtWeek(d){const end=new Date(d);end.setDate(end.getDate()+4);const a=d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'});const b=end.toLocaleDateString('it-IT',{day:'2-digit',month:'short'});return a+' – '+b}
function weekRecord(){const key=iso(currentWeek);if(!db.weeks[key]){db.weeks[key]={};dayDefs.forEach(([day])=>db.weeks[key][day]={lunch:null,dinner:null})}return db.weeks[key]}
async function load(){try{const r=await fetch(API_URL,{cache:'no-store'});if(!r.ok)throw new Error();const j=await r.json();db=j.data;version=j.version;renderAll()}catch(e){showStatus('Impossibile caricare i dati');renderAll()}}
async function save(){try{const r=await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Expected-SHA':version},body:JSON.stringify(db)});if(r.status===409){const j=await r.json();db=j.data;version=j.version;renderAll();showStatus('Dati aggiornati da un altro dispositivo');return false}if(!r.ok)throw new Error();const j=await r.json();db=j.data;version=j.version;renderAll();return true}catch(e){showStatus('Salvataggio non riuscito');return false}}
function renderAll(){document.getElementById('week-title').textContent=fmtWeek(currentWeek);document.getElementById('week-sub').textContent=currentWeek.getFullYear();renderMenu();renderDishes();updateSwitch()}
function renderMenu(){const rec=weekRecord();let html='<div class="menu-head"><div></div><div>☀️ Pranzo</div><div>🌙 Cena</div></div>';dayDefs.forEach(([key,label],i)=>{if(i>4&&!db.settings.showWeekend)return;html+=`<div class="day-row"><div class="day-name">${label}</div>${cellHtml(key,'lunch',rec[key]?.lunch)}${cellHtml(key,'dinner',rec[key]?.dinner)}</div>`});document.getElementById('menu-grid').innerHTML=html}
function cellHtml(day,meal,value){if(!value)return `<div class="meal"><button class="meal-btn" onclick="openSelector('${day}','${meal}')"><span class="plus">＋</span></button></div>`;if(value.type==='free')return `<div class="meal"><button class="meal-btn free" onclick="openCellActions('${day}','${meal}')"><span class="notebook">▤</span>${esc(value.text)}</button></div>`;const dish=db.dishes.find(d=>d.id===value.dishId);return `<div class="meal"><button class="meal-btn dish" onclick="openCellActions('${day}','${meal}')">${dish?esc(dish.title):'Piatto non disponibile'}</button></div>`}
function openSelector(day,meal){selectedCell={day,meal};let q='';document.getElementById('sheet-overlay').classList.add('show');document.getElementById('sheet').innerHTML=`<div class="handle"></div><div class="sheet-title">Scegli un piatto</div><div class="search"><span class="lens">⌕</span><input id="sheet-search" placeholder="Cerca un piatto…" oninput="renderSheetList()"><button class="clear" onclick="document.getElementById('sheet-search').value='';renderSheetList()">×</button></div><div id="sheet-list" class="sheet-list"></div><div style="height:8px"></div><button class="action" onclick="chooseFreeText()">▤ Inserisci testo libero</button>`;renderSheetList()}
function renderSheetList(){const term=(document.getElementById('sheet-search')?.value||'').trim().toLowerCase();const list=db.dishes.filter(d=>d.title.toLowerCase().includes(term)).sort((a,b)=>a.title.localeCompare(b.title,'it'));document.getElementById('sheet-list').innerHTML=list.length?list.map(d=>`<button class="sheet-row" onclick="chooseDish('${d.id}')">${esc(d.title)}</button>`).join(''):'<div class="empty">Nessun piatto trovato.</div>'}
function chooseDish(dishId){const rec=weekRecord();rec[selectedCell.day][selectedCell.meal]={type:'dish',dishId};closeSheet();save()}
function chooseFreeText(){closeSheet();openFreeTextModal(selectedCell.day,selectedCell.meal,'')}
function openCellActions(day,meal){selectedCell={day,meal};const value=weekRecord()[day][meal];let html='<div class="handle"></div><div class="sheet-title">Modifica pasto</div><div class="sheet-actions">';if(value?.type==='free')html+='<button class="action" onclick="editFreeText()">✎ Modifica testo</button>';else html+='<button class="action" onclick="openSelector(selectedCell.day,selectedCell.meal)">↻ Cambia piatto</button>';html+='<button class="action danger" onclick="clearCell()">× Svuota cella</button><button class="action cancel" onclick="closeSheet()">Annulla</button></div>';document.getElementById('sheet').innerHTML=html;document.getElementById('sheet-overlay').classList.add('show')}
function editFreeText(){const v=weekRecord()[selectedCell.day][selectedCell.meal];closeSheet();openFreeTextModal(selectedCell.day,selectedCell.meal,v?.text||'')}
function clearCell(){weekRecord()[selectedCell.day][selectedCell.meal]=null;closeSheet();save()}
function openFreeTextModal(day,meal,text){selectedCell={day,meal};modalMode='free';document.getElementById('modal-title').textContent='Testo libero';document.getElementById('modal-text').textContent='Inserisci il testo da mostrare nel pasto.';const input=document.getElementById('modal-input');input.value=text;input.placeholder='Es. Pasta al pesto';document.getElementById('modal-overlay').classList.add('show');setTimeout(()=>input.focus(),50)}
function openDishModal(){modalMode='dish';document.getElementById('modal-title').textContent='Aggiungi piatto';document.getElementById('modal-text').textContent='Il nome sarà aggiunto alla tua anagrafica dei piatti.';const input=document.getElementById('modal-input');input.value='';input.placeholder='Nome del piatto';document.getElementById('modal-overlay').classList.add('show');setTimeout(()=>input.focus(),50)}
function saveDish(){const input=document.getElementById('modal-input');const text=input.value.trim();if(!text)return;if(modalMode==='free'){weekRecord()[selectedCell.day][selectedCell.meal]={type:'free',text};closeModal();save();return}if(db.dishes.some(d=>d.title.trim().toLowerCase()===text.toLowerCase())){document.getElementById('modal-text').textContent='Esiste già un piatto con questo nome.';input.focus();return}db.dishes.push({id:id(),title:text,active:true});closeModal();save()}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show')}
function closeSheet(){document.getElementById('sheet-overlay').classList.remove('show');selectedCell=null}
function changeWeek(delta){currentWeek=new Date(currentWeek);currentWeek.setDate(currentWeek.getDate()+delta*7);renderMenu()}
function showPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+name).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+name).classList.add('active');if(name==='menu')renderMenu();if(name==='dishes')renderDishes()}
function renderDishes(){const term=(document.getElementById('dish-search')?.value||'').trim().toLowerCase();const list=db.dishes.filter(d=>d.title.toLowerCase().includes(term)).sort((a,b)=>a.title.localeCompare(b.title,'it'));document.getElementById('dish-list').innerHTML=list.length?list.map(d=>{const count=usageCount(d.id);return `<div class="dish-item"><div><div class="dish-name">${esc(d.title)}</div><div class="dish-count">${count?count+' utilizzi nel menu':'Non ancora utilizzato'}</div></div></div>`}).join(''):'<div class="empty">Nessun piatto presente.</div>'}
function usageCount(id){let n=0;Object.values(db.weeks||{}).forEach(w=>dayDefs.forEach(([d])=>['lunch','dinner'].forEach(m=>{if(w[d]?.[m]?.type==='dish'&&w[d][m].dishId===id)n++})));return n}
function clearSearch(){document.getElementById('dish-search').value='';renderDishes()}
function toggleWeekend(){db.settings.showWeekend=!db.settings.showWeekend;updateSwitch();renderMenu();save()}
function updateSwitch(){document.getElementById('weekend-switch').classList.toggle('on',!!db.settings.showWeekend)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showStatus(text){const e=document.getElementById('status');e.textContent=text;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
load();
</script>
</body>
</html>
