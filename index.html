<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MenuWeekly</title>
<style>
:root{--bg:#f5f7f5;--surface:#fff;--surface-2:#f8faf8;--ink:#16231d;--muted:#77827c;--line:#e2e8e3;--green:#198c70;--green-dark:#14765f;--green-soft:#e9f5ef;--blue:#edf5fb;--blue-ink:#4e718b;--danger:#c25d5d;--danger-soft:#fff0f0;--shadow:0 8px 28px rgba(22,43,34,.07);--shadow-lg:0 18px 50px rgba(20,42,32,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{padding-bottom:88px}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{width:min(720px,100%);margin:auto;min-height:100vh}header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:70px;background:rgba(245,247,245,.96);backdrop-filter:blur(14px);z-index:20;display:flex;align-items:center;justify-content:center}.brand{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:850;letter-spacing:-.045em}.brand .brand-mark{width:23px;height:23px;color:var(--green)}.brand .brand-menu{color:var(--green)}.brand .brand-weekly{color:var(--ink)}main{padding:84px 16px 22px}.page{display:none}.page.active{display:block}.weekbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:0 0 14px}.week-center{text-align:center}.week-title{font-size:17px;font-weight:850;letter-spacing:-.02em}.week-sub{display:block;font-size:11px;color:var(--muted);font-weight:650;margin-top:3px}.navbtn{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:.18s}.navbtn:active{transform:scale(.96);background:var(--surface-2)}.navbtn svg{width:19px;height:19px}.menu-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.menu-head,.day-row{display:grid;grid-template-columns:48px 1fr 1fr}.menu-head{background:#f8faf8;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;color:#637069}.menu-head div{height:42px;display:flex;align-items:center;justify-content:center;gap:5px}.menu-head div+div{border-left:1px solid var(--line)}.menu-head svg{width:15px;height:15px}.day-row{min-height:64px;border-bottom:1px solid #edf1ed}.day-row:last-child{border-bottom:0}.day-name{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:850;color:#536059;letter-spacing:.02em}.meal{padding:7px;border-left:1px solid #edf1ed;display:flex;align-items:stretch}.meal-btn{width:100%;min-height:49px;border-radius:13px;border:1px dashed #d1dad3;background:#fbfcfb;display:flex;align-items:center;justify-content:center;padding:7px 8px;text-align:center;font-size:11.5px;font-weight:750;color:#7b857f;line-height:1.2;transition:.16s}.meal-btn:active{transform:scale(.985)}.meal-btn.dish{background:var(--green-soft);border:1px solid #cfe8da;color:#245c4a}.meal-btn.free{background:var(--blue);border:1px solid #d7e7f1;color:var(--blue-ink)}.meal-btn .notebook{display:inline-flex;margin-right:5px}.meal-btn .notebook svg{width:15px;height:15px}.meal-btn .plus{font-size:21px;font-weight:400;color:#9aa59f}.section-title{font-size:23px;font-weight:850;letter-spacing:-.035em;margin:2px 2px 16px}.dishes-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}.dishes-head .section-title{margin:0}.add-dish{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 16px rgba(25,140,112,.2);transition:.16s}.add-dish:active{transform:scale(.96);background:var(--green-dark)}.add-dish svg{width:20px;height:20px}.search{position:relative;margin-bottom:10px}.search input{width:100%;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 42px;color:var(--ink);outline:none;box-shadow:0 3px 12px rgba(22,43,34,.035);transition:.18s}.search input:focus{border-color:#b9d8cb;box-shadow:0 0 0 3px rgba(25,140,112,.08)}.search .lens{position:absolute;left:14px;top:11px;color:#7d8982;line-height:23px;pointer-events:none}.search .lens svg{width:20px;height:20px}.search .clear{position:absolute;right:7px;top:6px;width:34px;height:34px;border-radius:10px;color:#8a958e;font-size:18px}.dish-list{display:flex;flex-direction:column;gap:7px}.dish-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 13px;min-height:48px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 12px rgba(22,43,34,.035)}.dish-name{font-size:13px;font-weight:750;line-height:1.25}.dish-actions{display:flex;align-items:center;gap:6px;margin-left:10px}.dish-action{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}.dish-action.edit{background:#edf7f1;color:var(--green)}.dish-action.delete{background:var(--danger-soft);color:var(--danger)}.dish-action svg{width:20px;height:20px;display:block}.empty{padding:38px 18px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface);border:1px dashed #d5ded8;border-radius:16px}.settings-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:850;margin:0 2px 8px}.settings-list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.setting{padding:17px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}.setting-title{font-size:14px;font-weight:800}.setting-desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}.switch{flex:0 0 auto;width:48px;height:28px;border-radius:20px;background:#d4dcd6;padding:3px;transition:.2s}.switch i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.16);transition:.2s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(20px)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:78px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20;display:grid;grid-template-columns:repeat(3,1fr);padding:7px 10px calc(7px + env(safe-area-inset-bottom));gap:5px}.tab{border-radius:14px;color:#89948d;font-size:9px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tab.active{background:#edf6f0;color:var(--green)}.tab .ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center}.tab .ico svg{width:19px;height:19px}.overlay{position:fixed;inset:0;background:rgba(24,35,29,.38);backdrop-filter:blur(4px);z-index:40;display:none}.overlay.show{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;margin:auto;width:min(720px,100%);max-height:80vh;background:var(--surface);border-radius:25px 25px 0 0;padding:10px 14px calc(17px + env(safe-area-inset-bottom));box-shadow:0 -16px 50px rgba(20,42,32,.16);overflow:auto}.handle{width:40px;height:4px;border-radius:10px;background:#d8dfda;margin:3px auto 16px}.sheet-title{font-size:17px;font-weight:850;letter-spacing:-.02em;margin-bottom:13px}.sheet-current{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-radius:14px;margin-bottom:10px}.sheet-current.dish{background:var(--green-soft);color:#245c4a}.sheet-current.free{background:var(--blue);color:var(--blue-ink)}.sheet-current .label{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}.sheet-current svg{width:18px;height:18px}.sheet-search{position:relative;margin-bottom:10px}.sheet-search input{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:0 40px;color:var(--ink);outline:none}.sheet-search .lens{position:absolute;left:13px;top:11px;color:#7d8982}.sheet-search .lens svg{width:19px;height:19px}.sheet-search .clear{position:absolute;right:7px;top:5px;width:34px;height:34px;border-radius:10px;color:#8a958d;font-size:18px}.sheet-list{display:flex;flex-direction:column;gap:7px}.sheet-row{min-height:45px;padding:11px 13px;border:1px solid #e2e8e3;border-radius:13px;text-align:left;background:#fafcfb;color:var(--ink);font-size:12.5px;font-weight:750;display:flex;align-items:center;justify-content:space-between}.sheet-row.selected{background:var(--green-soft);border-color:#cbe5d6;color:#245c4a}.sheet-row .check{color:var(--green);display:flex}.sheet-row .check svg{width:18px;height:18px}.sheet-actions{display:flex;flex-direction:column;gap:8px}.action{min-height:45px;padding:11px 13px;border-radius:13px;text-align:left;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:9px}.action svg{width:18px;height:18px;flex:0 0 auto}.action.free-action{background:var(--blue);border:1px solid #d5e5ef;color:var(--blue-ink)}.action.cancel{background:#f4f5f4;border:1px solid #e2e5e2;color:#68736c;justify-content:center}.action.danger{color:var(--danger);background:var(--danger-soft)}.selector-top-actions{margin-bottom:12px}.selector-bottom-actions{margin-top:9px}.modal{position:fixed;inset:0;background:rgba(24,35,29,.42);backdrop-filter:blur(5px);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(390px,100%);background:var(--surface);border-radius:22px;padding:21px;box-shadow:var(--shadow-lg)}.dialog h3{margin:0;font-size:18px;letter-spacing:-.02em}.dialog p{font-size:12px;color:var(--muted);line-height:1.5}.dialog input{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;padding:0 13px;outline:none;color:var(--ink)}.dialog input:focus{border-color:#b9d8cb;box-shadow:0 0 0 3px rgba(25,140,112,.08)}.dialog-actions{display:flex;gap:8px;margin-top:14px}.dialog-actions button{flex:1;min-height:44px;padding:11px;border-radius:12px;font-size:12px;font-weight:850;background:#f1f4f1}.dialog-actions .primary{background:var(--green);color:#fff}.confirm-dialog{text-align:center}.confirm-icon{width:50px;height:50px;border-radius:16px;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}.confirm-icon svg{width:25px;height:25px}.confirm-dialog h3{margin:0}.confirm-dialog p{margin:8px 0 0}.confirm-dialog .dialog-actions{margin-top:18px}.confirm-dialog .delete-confirm{background:var(--danger);color:#fff}.status{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:70;background:#22332a;color:#fff;border-radius:20px;padding:8px 13px;font-size:11px;font-weight:750;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.15)}.status.show{opacity:1}.loading{padding:52px;text-align:center;color:var(--muted);font-size:13px}@media(min-width:560px){main{padding-left:20px;padding-right:20px}.menu-head,.day-row{grid-template-columns:58px 1fr 1fr}.day-row{min-height:68px}.meal-btn{min-height:53px}.sheet{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3v7.5M9 3v7.5M6 7h3M7.5 10.5V21"/><path d="M15.5 3v18M15.5 3c3 2 3.2 6.3 0 8"/></svg><span class="brand-menu">Menu</span><span class="brand-weekly">Weekly</span></div></header>
<main>
<section id="page-menu" class="page active"><div class="weekbar"><button class="navbtn" onclick="changeWeek(-1)" aria-label="Settimana precedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m14.5 5-7 7 7 7"/></svg></button><div class="week-center"><div id="week-title" class="week-title"></div><span id="week-sub" class="week-sub"></span></div><button class="navbtn" onclick="changeWeek(1)" aria-label="Settimana successiva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9.5 5 7 7-7 7"/></svg></button></div><div id="menu-grid" class="menu-card"><div class="loading">Caricamento…</div></div></section>
<section id="page-dishes" class="page"><div class="dishes-head"><div class="section-title">I miei piatti</div><button class="add-dish" aria-label="Aggiungi piatto" onclick="openDishModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="search"><span class="lens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 5 5"/></svg></span><input id="dish-search" oninput="renderDishes()" placeholder="Cerca un piatto…"><button class="clear" onclick="clearSearch()" aria-label="Cancella ricerca">×</button></div><div id="dish-list" class="dish-list"></div></section>
<section id="page-settings" class="page"><div class="section-title">Impostazioni</div><div class="settings-eyebrow">Visualizzazione</div><div class="settings-list"><div class="setting"><div><div class="setting-title">Mostra weekend</div><div class="setting-desc">Aggiunge sabato e domenica al menu settimanale.</div></div><button id="weekend-switch" class="switch" onclick="toggleWeekend()" aria-label="Mostra weekend"><i></i></button></div></div></section>
</main>
<nav><button id="tab-menu" class="tab active" onclick="showPage('menu')"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 12h14M5 19h14"/><circle cx="5" cy="5" r="1" fill="currentColor"/><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="5" cy="19" r="1" fill="currentColor"/></svg></span>MENU</button><button id="tab-dishes" class="tab" onclick="showPage('dishes')"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9.5h14v8.2A2.3 2.3 0 0 1 16.7 20H7.3A2.3 2.3 0 0 1 5 17.7V9.5Z"/><path d="M8 9.5c0-2.3 1.7-4 4-4s4 1.7 4 4M9 12v1M12 12v1M15 12v1"/></svg></span>I MIEI PIATTI</button><button id="tab-settings" class="tab" onclick="showPage('settings')"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8 13.1 5l1.8.3.9-.7 1.8 1.1-.2 1.2 1 1.5 1.2.3v2.1l-1.2.5-1 1.5.2 1.2-1.8 1.1-.9-.7-1.8.3-1.1 1.2h-2l-1.1-1.2-1.8-.3-.9.7-1.8-1.1.2-1.2-1-1.5-1.2-.5V8.7l1.2-.5 1-1.5-.2-1.2 1.8-1.1.9.7 1.8-.3L10 3.8h2Z"/><circle cx="12" cy="9.9" r="2.5"/></svg></span>IMPOSTAZIONI</button></nav>
</div>
<div id="sheet-overlay" class="overlay" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet"></div></div>
<div id="modal-overlay" class="modal" onclick="if(event.target===this)closeModal()"><div id="dialog" class="dialog"></div></div>
<div id="status" class="status"></div>
<script>
const API_URL='https://menu-weekly-gregdavide-4207.vercel.app/api/menu';
const dayDefs=[['monday','LUN','Lunedì'],['tuesday','MAR','Martedì'],['wednesday','MER','Mercoledì'],['thursday','GIO','Giovedì'],['friday','VEN','Venerdì'],['saturday','SAB','Sabato'],['sunday','DOM','Domenica']];
let db={dishes:[],weeks:{},settings:{showWeekend:false}},version=null,currentWeek=getMonday(new Date()),selectedCell=null,modalMode='dish',editingDishId=null,confirmDishId=null;
const icons={
 pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 16.8-.8 3.5 3.5-.8L19 7.7a2.2 2.2 0 0 0 0-3.1l-.6-.6a2.2 2.2 0 0 0-3.1 0L4.5 16.8Z"/><path d="m13.8 5.8 4.4 4.4"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9 7V4.5h6V7M7 7l.9 13h8.2L17 7M10 10.5v6M14 10.5v6"/></svg>',
 notebook:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10.5A2.5 2.5 0 0 1 18 7v12.5H7.5A2.5 2.5 0 0 1 5 17V4.5Z"/><path d="M18 7h1v12.5h-9"/><path d="M8 9h6M8 12h5"/></svg>',
 dish:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 13.5h14"/><path d="M6.5 13.5a5.5 5.5 0 0 1 11 0"/><path d="M8 7.5c1-1.1 2.2-1.7 4-1.7s3 .6 4 1.7"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.2 4.2L19 7"/></svg>'
};
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function getMonday(d){const x=new Date(d);x.setHours(12,0,0,0);const day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
function fmtWeek(d){const end=new Date(d);end.setDate(end.getDate()+4);const a=d.toLocaleDateString('it-IT',{day:'numeric'});const b=end.toLocaleDateString('it-IT',{day:'numeric'});const m1=d.toLocaleDateString('it-IT',{month:'long'});const m2=end.toLocaleDateString('it-IT',{month:'long'});const y=end.getFullYear();return m1===m2?a+' – '+b+' '+m2+' '+y:a+' '+m1+' – '+b+' '+m2+' '+y}
function isCurrentWeek(){return iso(currentWeek)===iso(getMonday(new Date()))}
function weekRecord(){const key=iso(currentWeek);if(!db.weeks[key]){db.weeks[key]={};dayDefs.forEach(([day])=>db.weeks[key][day]={lunch:null,dinner:null})}return db.weeks[key]}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function getDish(id){return db.dishes.find(d=>d.id===id)}
async function load(){try{const r=await fetch(API_URL,{cache:'no-store'});if(!r.ok)throw new Error();const j=await r.json();db=j.data||db;version=j.version||null;renderAll()}catch(e){showStatus('Impossibile caricare i dati');renderAll()}}
async function save(){try{const r=await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Expected-SHA':version},body:JSON.stringify(db)});if(r.status===409){const j=await r.json();db=j.data;version=j.version;renderAll();showStatus('Dati aggiornati da un altro dispositivo');return false}if(!r.ok)throw new Error();const j=await r.json();db=j.data;version=j.version;renderAll();return true}catch(e){showStatus('Salvataggio non riuscito');return false}}
function renderAll(){document.getElementById('week-title').textContent=fmtWeek(currentWeek);document.getElementById('week-sub').textContent=isCurrentWeek()?'Settimana corrente':'Settimana';renderMenu();renderDishes();updateSwitch()}
function renderMenu(){const rec=weekRecord();const visible=db.settings?.showWeekend?dayDefs:dayDefs.slice(0,5);let html='<div class="menu-head"><div></div><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>Pranzo</div><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15.5 4.2a7.4 7.4 0 1 0 4.3 11.3A7.5 7.5 0 0 1 15.5 4.2Z"/></svg>Cena</div></div>';visible.forEach(([day,short,label])=>{html+='<div class="day-row"><div class="day-name">'+short+'</div>'+mealHtml(day,'lunch',rec[day]?.lunch)+mealHtml(day,'dinner',rec[day]?.dinner)+'</div>'});document.getElementById('menu-grid').innerHTML=html}
function mealHtml(day,meal,cell){let content='';let cls='';if(cell?.type==='dish'){const d=getDish(cell.dishId);content=esc(d?.title||'Piatto non disponibile');cls='dish'}else if(cell?.type==='free'){content='<span class="notebook">'+icons.notebook+'</span>'+esc(cell.text||'');cls='free'}else{content='<span class="plus">+</span>'}return '<div class="meal"><button class="meal-btn '+cls+'" onclick="openCell(\''+day+'\',\''+meal+'\')">'+content+'</button></div>'}
function changeWeek(delta){currentWeek.setDate(currentWeek.getDate()+delta*7);document.getElementById('week-title').textContent=fmtWeek(currentWeek);document.getElementById('week-sub').textContent=isCurrentWeek()?'Settimana corrente':'Settimana';renderMenu()}
function showPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+page).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+page).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function updateSwitch(){const s=document.getElementById('weekend-switch');if(s)s.classList.toggle('on',!!db.settings?.showWeekend)}
async function toggleWeekend(){db.settings.showWeekend=!db.settings.showWeekend;updateSwitch();renderMenu();await save()}
function openCell(day,meal){selectedCell={day,meal};const cell=weekRecord()[day][meal];const dayLabel=dayDefs.find(x=>x[0]===day)?.[2]||day;const mealLabel=meal==='lunch'?'Pranzo':'Cena';let current='';if(cell?.type==='dish'){const d=getDish(cell.dishId);current='<div class="sheet-current dish"><div class="label">'+icons.dish+esc(d?.title||'Piatto non disponibile')+'</div></div>'}else if(cell?.type==='free'){current='<div class="sheet-current free"><div class="label">'+icons.notebook+esc(cell.text||'')+'</div></div>'}let actions='';if(cell?.type==='dish'){actions='<div class="sheet-actions"><button class="action" onclick="openSelector()">'+icons.dish+'Cambia piatto</button><button class="action danger" onclick="clearCell()">'+icons.trash+'Svuota cella</button></div>'}else if(cell?.type==='free'){actions='<div class="sheet-actions"><button class="action" onclick="openFreeText(true)">'+icons.pencil+'Modifica testo</button><button class="action danger" onclick="clearCell()">'+icons.trash+'Svuota cella</button></div>'}else{actions='<div class="sheet-actions"><button class="action free-action" onclick="openFreeText(false)">'+icons.notebook+'Inserisci testo libero</button><button class="action" onclick="openSelector()">'+icons.dish+'Scegli un piatto</button></div>'}document.getElementById('sheet').innerHTML='<div class="handle"></div><div class="sheet-title">'+esc(dayLabel)+' · '+mealLabel+'</div>'+current+actions+'<div class="sheet-actions selector-bottom-actions"><button class="action cancel" onclick="closeSheet()">Annulla</button></div>';document.getElementById('sheet-overlay').classList.add('show')}
function openSelector(){const cell=weekRecord()[selectedCell.day][selectedCell.meal];const currentId=cell?.type==='dish'?cell.dishId:null;document.getElementById('sheet').innerHTML='<div class="handle"></div><div class="sheet-title">Scegli il piatto</div><div class="sheet-actions selector-top-actions"><button class="action free-action" onclick="openFreeText(false)">'+icons.notebook+'Inserisci testo libero</button></div><div class="sheet-search"><span class="lens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 5 5"/></svg></span><input id="selector-search" oninput="renderSelectorList()" placeholder="Cerca un piatto…"><button class="clear" onclick="clearSelectorSearch()">×</button></div><div id="selector-list" class="sheet-list"></div><div class="sheet-actions selector-bottom-actions"><button class="action cancel" onclick="closeSheet()">Annulla</button></div>';renderSelectorList();setTimeout(()=>document.getElementById('selector-search')?.focus(),50)}
function renderSelectorList(){const q=(document.getElementById('selector-search')?.value||'').trim().toLowerCase();const cell=selectedCell?weekRecord()[selectedCell.day][selectedCell.meal]:null;const currentId=cell?.type==='dish'?cell.dishId:null;const list=db.dishes.filter(d=>d.active!==false&&d.title.toLowerCase().includes(q));const el=document.getElementById('selector-list');if(!el)return;if(!list.length){el.innerHTML='<div class="empty">Nessun piatto trovato</div>';return}el.innerHTML=list.map(d=>'<button class="sheet-row '+(d.id===currentId?'selected':'')+'" onclick="selectDish(\''+d.id+'\')"><span>'+esc(d.title)+'</span>'+(d.id===currentId?'<span class="check">'+icons.check+'</span>':'')+'</button>').join('')}
function clearSelectorSearch(){const i=document.getElementById('selector-search');if(i){i.value='';renderSelectorList();i.focus()}}
async function selectDish(dishId){if(!selectedCell)return;weekRecord()[selectedCell.day][selectedCell.meal]={type:'dish',dishId};closeSheet();renderMenu();await save()}
function openFreeText(edit){const cell=selectedCell?weekRecord()[selectedCell.day][selectedCell.meal]:null;modalMode='free';const value=edit&&cell?.type==='free'?cell.text:'';document.getElementById('dialog').innerHTML='<h3>'+ (edit?'Modifica testo':'Inserisci testo libero') +'</h3><p>'+ (edit?'Aggiorna il testo associato a questo pasto.':'Inserisci un pasto che non vuoi aggiungere all’anagrafica dei piatti.') +'</p><input id="modal-input" maxlength="120" value="'+esc(value)+'" placeholder="Cosa mangerai?"><div class="dialog-actions"><button onclick="closeModal()">Annulla</button><button class="primary" onclick="saveModal()">Salva</button></div>';document.getElementById('modal-overlay').classList.add('show');setTimeout(()=>{const i=document.getElementById('modal-input');i?.focus();i?.select()},50)}
function openDishModal(){modalMode='dish';editingDishId=null;document.getElementById('dialog').innerHTML='<h3>Aggiungi piatto</h3><p>Il piatto verrà aggiunto alla tua anagrafica.</p><input id="modal-input" maxlength="80" placeholder="Nome del piatto"><div class="dialog-actions"><button onclick="closeModal()">Annulla</button><button class="primary" onclick="saveModal()">Salva</button></div>';document.getElementById('modal-overlay').classList.add('show');setTimeout(()=>document.getElementById('modal-input')?.focus(),50)}
function openEditDishModal(dishId){const d=getDish(dishId);if(!d)return;modalMode='edit';editingDishId=dishId;document.getElementById('dialog').innerHTML='<h3>Modifica piatto</h3><p>Aggiorna il nome del piatto.</p><input id="modal-input" maxlength="80" value="'+esc(d.title)+'" placeholder="Nome del piatto"><div class="dialog-actions"><button onclick="closeModal()">Annulla</button><button class="primary" onclick="saveModal()">Salva</button></div>';document.getElementById('modal-overlay').classList.add('show');setTimeout(()=>{const i=document.getElementById('modal-input');i?.focus();i?.select()},50)}
async function saveModal(){const input=document.getElementById('modal-input');const value=(input?.value||'').trim();if(!value){input?.focus();return}if(modalMode==='free'){if(!selectedCell)return;weekRecord()[selectedCell.day][selectedCell.meal]={type:'free',text:value};closeModal();closeSheet();renderMenu();await save();return}const duplicate=db.dishes.some(d=>d.id!==editingDishId&&d.active!==false&&d.title.trim().toLowerCase()===value.toLowerCase());if(duplicate){showDuplicate(value);return}if(modalMode==='edit'){const d=getDish(editingDishId);if(d)d.title=value}else{db.dishes.push({id:id(),title:value,active:true})}closeModal();renderDishes();await save()}
function showDuplicate(value){document.getElementById('dialog').innerHTML='<div class="confirm-dialog"><div class="confirm-icon" style="background:#fff1e7;color:#e47a25;font-size:27px;font-weight:900">!</div><h3>Piatto già esistente</h3><p>Il piatto “'+esc(value)+'” è già presente nell’anagrafica.</p><div class="dialog-actions"><button class="primary" onclick="closeModal()">OK</button></div></div>'}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show')}
function closeSheet(){document.getElementById('sheet-overlay').classList.remove('show')}
function clearSearch(){const i=document.getElementById('dish-search');if(i){i.value='';renderDishes();i.focus()}}
function renderDishes(){const q=(document.getElementById('dish-search')?.value||'').trim().toLowerCase();const list=db.dishes.filter(d=>d.active!==false&&d.title.toLowerCase().includes(q)).sort((a,b)=>a.title.localeCompare(b.title,'it'));const el=document.getElementById('dish-list');if(!el)return;if(!list.length){el.innerHTML='<div class="empty">'+(q?'Nessun piatto trovato.':'Non hai ancora aggiunto piatti.')+'</div>';return}el.innerHTML=list.map(d=>'<div class="dish-item"><div class="dish-name">'+esc(d.title)+'</div><div class="dish-actions"><button class="dish-action edit" aria-label="Modifica '+esc(d.title)+'" onclick="openEditDishModal(\''+d.id+'\')">'+icons.pencil+'</button><button class="dish-action delete" aria-label="Elimina '+esc(d.title)+'" onclick="openDeleteDish(\''+d.id+'\')">'+icons.trash+'</button></div></div>').join('')}
function usageCount(dishId){let n=0;Object.values(db.weeks||{}).forEach(w=>Object.values(w||{}).forEach(day=>['lunch','dinner'].forEach(m=>{if(day?.[m]?.type==='dish'&&day[m].dishId===dishId)n++})));return n}
function openDeleteDish(dishId){const d=getDish(dishId);if(!d)return;confirmDishId=dishId;const n=usageCount(dishId);document.getElementById('dialog').innerHTML='<div class="confirm-dialog"><div class="confirm-icon">'+icons.trash+'</div><h3>Eliminare piatto?</h3><p>“'+esc(d.title)+'”'+(n?' è usato in '+n+' '+(n===1?'pasto':'pasti')+'. Verrà rimosso anche dal menu.':' verrà eliminato dall’anagrafica.')+'</p><div class="dialog-actions"><button onclick="closeModal()">Annulla</button><button class="primary delete-confirm" onclick="confirmDeleteDish()">Elimina</button></div></div>';document.getElementById('modal-overlay').classList.add('show')}
async function confirmDeleteDish(){const d=getDish(confirmDishId);if(!d)return;db.dishes=db.dishes.filter(x=>x.id!==confirmDishId);Object.values(db.weeks||{}).forEach(w=>Object.values(w||{}).forEach(day=>['lunch','dinner'].forEach(m=>{if(day?.[m]?.type==='dish'&&day[m].dishId===confirmDishId)day[m]=null})));confirmDishId=null;closeModal();renderAll();await save()}
function showStatus(text){const s=document.getElementById('status');s.textContent=text;s.classList.add('show');clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>s.classList.remove('show'),2600)}
async function clearCell(){if(!selectedCell)return;weekRecord()[selectedCell.day][selectedCell.meal]=null;closeSheet();renderMenu();await save()}
load();
</script>
</body>
